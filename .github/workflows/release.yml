name: Release MCP Paint

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and verify
        run: mvn --batch-mode clean verify
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          jar="target/mcp-paint-${RELEASE_TAG#v}.jar"
          if [ ! -f "$jar" ]; then
            echo "Tag $RELEASE_TAG does not match the Maven project version."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$jar" --verify-tag --generate-notes
