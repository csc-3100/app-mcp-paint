name: Bug report
description: Report a problem running MCP Paint or following instructions
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a problem. Never share passwords, API keys, tokens, or private device information."
  - type: input
    id: example
    attributes:
      label: Affected part of MCP Paint
      placeholder: "Mouse drawing, Claude Desktop setup, or an MCP tool"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Describe what you did, including relevant commands."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "Include sanitized error messages if useful."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Operating system, Java version, Maven version, and Claude Desktop version if relevant"
  - type: textarea
    id: setup
    attributes:
      label: Claude Desktop setup (if relevant)
      description: "Share only relevant, sanitized settings and logs."
